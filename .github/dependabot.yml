# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Dev/test/lint/security tooling — grouped across ALL update types
      # (including major) so a weekly scan opens at most one PR touching
      # requirements-dev.txt instead of one PR per package. Separate PRs that
      # each bump an adjacent line in the same file cause cascading merge
      # conflicts as soon as the first one merges (see #90/#91/#92, 2026-07).
      python-dev-tools:
        patterns:
          - "pytest*"
          - "black"
          - "flake8*"
          - "isort"
          - "pylint"
          - "mypy"
          - "bandit*"
          - "safety"
          - "pre-commit"
          - "sphinx*"
          - "ipython"
          - "ipdb"
        update-types:
          - "major"
          - "minor"
          - "patch"
      # Runtime (production) dependencies: keep minor/patch grouped, but leave
      # major bumps as individual PRs for closer review since they ship to users.
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # pip (macOS platform)
  #
  # platforms/macos/requirements.txt was covered by no ecosystem entry: the pip
  # entry above is scoped to "/". That left torch, torchvision, opencv-python,
  # Pillow, easyocr and pdf2image - an ML stack with a long CVE history -
  # getting no version updates at all. `safety` in CI does not cover it either;
  # it scans the installed environment, which never installs this file.
  - package-ecosystem: "pip"
    directory: "/platforms/macos"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "macos"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      macos-python:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # npm (macOS packaging)
  #
  # This ecosystem was missing entirely, so every electron/js-yaml/xmldom PR
  # arrived as an ungrouped *security* update - one PR per package, each
  # rewriting platforms/macos/package-lock.json. That is what made #125/#126
  # conflict with #128 and with each other: whichever merged first left the
  # rest stale against the same lockfile. Grouping them means one PR per scan.
  - package-ecosystem: "npm"
    directory: "/platforms/macos"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # One PR for the whole lockfile, majors included: separate PRs touching
      # the same package-lock.json conflict by construction.
      macos-packaging:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # #119/#120/#122/#123 were four PRs for what is one concern: keeping
      # pinned action SHAs current. Grouped, that is one PR per week.
      github-actions:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  # Docker
  - package-ecosystem: "docker"
    directory: "/platforms/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docker:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
