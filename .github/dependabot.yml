# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"
    reviewers:
      - "v-giannakopoulos"
    groups:
      # Dev/test/lint/security tooling — grouped across ALL update types
      # (including major) so a weekly scan opens at most one PR touching
      # requirements-dev.txt instead of one PR per package. Separate PRs that
      # each bump an adjacent line in the same file cause cascading merge
      # conflicts as soon as the first one merges (see #90/#91/#92, 2026-07).
      python-dev-tools:
        patterns:
          - "pytest*"
          - "black"
          - "flake8*"
          - "isort"
          - "pylint"
          - "mypy"
          - "bandit*"
          - "safety"
          - "pre-commit"
          - "sphinx*"
          - "ipython"
          - "ipdb"
        update-types:
          - "major"
          - "minor"
          - "patch"
      # Runtime (production) dependencies: keep minor/patch grouped, but leave
      # major bumps as individual PRs for closer review since they ship to users.
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    reviewers:
      - "v-giannakopoulos"

  # Docker
  - package-ecosystem: "docker"
    directory: "/platforms/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"
    reviewers:
      - "v-giannakopoulos"
