name: Tests

# Explicit permissions for security
permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    strategy:
      matrix:
        # 3.9 dropped: the code uses PEP 604 union syntax (e.g. `str | None`),
        # which requires Python 3.10+.
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run linters
        run: |
          black --check .
          flake8 .
          isort --check-only .

      - name: Run tests with coverage
        run: |
          pytest --cov=. --cov-report=xml --cov-report=html --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Run security checks
        run: |
          # Fail only on medium+ severity findings. The low-severity findings here
          # are reviewed and benign (subprocess use for native file dialogs with
          # static args, sentinel default-credential constants, skip-on-error).
          bandit -r . -c pyproject.toml --severity-level medium
          safety check

  docker-test:
    name: Test Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Build Docker image
        working-directory: platforms/docker
        run: |
          docker build -f Dockerfile -t receipts-manager:test ../..

      - name: Test Docker image
        run: |
          docker run -d -p 8765:8765 --name test-container receipts-manager:test
          sleep 10
          curl -f http://localhost:8765 || exit 1
          docker logs test-container
          docker stop test-container
