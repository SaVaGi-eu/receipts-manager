name: Tests

# Explicit permissions for security
permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    strategy:
      matrix:
        # 3.9 dropped: the code uses PEP 604 union syntax (e.g. `str | None`),
        # which requires Python 3.10+.
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install Python dependencies
        run: |
          # setuptools is upgraded explicitly: it ships in the runner image, is
          # not a project dependency, and safety scans the whole environment.
          python -m pip install --upgrade pip 'setuptools>=83.0.0'
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run linters
        run: |
          black --check .
          flake8 .
          isort --check-only .

      - name: Run tests with coverage
        run: |
          pytest --cov=. --cov-report=xml --cov-report=html --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Run security checks
        run: |
          # All previously-reviewed low-severity findings are now suppressed inline
          # with '# nosec Bxxx -- reason' at their exact locations (see app.py and
          # services/receipt_service.py), so bandit runs at its default severity —
          # any genuinely new finding, low or otherwise, will fail the build.
          bandit -r . -c pyproject.toml
          # Still `check`, not `scan`: `scan` requires a SAFETY_API_KEY, which
          # this repo has no secret for. `check` uses the open-source database
          # and needs no auth, at the cost of a deprecation banner.
          safety check

  docker-test:
    name: Test Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build Docker image
        working-directory: platforms/docker
        run: |
          docker build -f Dockerfile -t receipts-manager:test ../..

      - name: Test Docker image
        run: |
          docker run -d -p 8765:8765 --name test-container receipts-manager:test
          sleep 10
          curl -f http://localhost:8765 || exit 1
          docker logs test-container
          docker stop test-container
