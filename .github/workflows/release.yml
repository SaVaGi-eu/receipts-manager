name: Build and Release macOS App
# Explicit permissions for security
permissions:
  contents: write
  actions: read
  deployments: write
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
jobs:
  build-macos:
    name: Build macOS Application
    runs-on: macos-latest
    environment: production
    permissions:
      contents: write
      actions: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install Homebrew dependencies
        run: |
          brew install tesseract tesseract-lang
      - name: Create Python virtual environment
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          deactivate
      - name: Install Node dependencies
        working-directory: platforms/macos
        run: npm ci
      - name: Build macOS app
        working-directory: platforms/macos
        run: |
          # Detect architecture
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            npm run build
          else
            npm run build:x64
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: List build artifacts
        run: |
          echo "Build artifacts:"
          ls -lh platforms/macos/dist/
      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Receipt-Manager-macOS
          path: platforms/macos/dist/*.dmg
          if-no-files-found: error
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: platforms/macos/dist/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      actions: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build Docker image
        working-directory: platforms/docker
        run: |
          docker build -f Dockerfile -t receipts-manager:latest ../..
      - name: Test Docker image
        run: |
          docker run -d -p 8765:8765 --name test-container receipts-manager:latest
          sleep 10
          curl -f http://localhost:8765 || exit 1
          docker stop test-container
      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/receipts-manager"
          docker tag receipts-manager:latest "$IMAGE:$VERSION"
          docker tag receipts-manager:latest "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
