name: Build and Release macOS App
# Explicit permissions for security
permissions:
  contents: write
  actions: read
  deployments: write
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
jobs:
  build-macos:
    name: Build macOS Application
    runs-on: macos-latest
    environment: production
    permissions:
      contents: write
      actions: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install Homebrew dependencies
        run: |
          brew install tesseract tesseract-lang
      - name: Create Python virtual environment
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          deactivate
      - name: Install Node dependencies
        working-directory: platforms/macos
        run: npm ci
      - name: Build macOS app
        working-directory: platforms/macos
        # SECURITY: do NOT expose the repo-write GITHUB_TOKEN to `npm run build`.
        # electron-builder + hundreds of transitive node_modules run here; a
        # compromised dependency could read the token and push to the repo.
        # Publishing is handled separately by the pinned action-gh-release step,
        # and electron-builder must not auto-publish (no `publish` config set).
        run: |
          # Detect architecture
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            npm run build
          else
            npm run build:x64
          fi
      - name: List build artifacts
        run: |
          echo "Build artifacts:"
          ls -lh platforms/macos/dist/
      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Receipt-Manager-macOS
          path: platforms/macos/dist/*.dmg
          if-no-files-found: error
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: platforms/macos/dist/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      actions: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build Docker image
        working-directory: platforms/docker
        run: |
          docker build -f Dockerfile -t receipts-manager:latest ../..
      - name: Test Docker image
        run: |
          docker run -d -p 8765:8765 --name test-container receipts-manager:latest
          sleep 10
          curl -f http://localhost:8765 || exit 1
          docker stop test-container
      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/receipts-manager"
          docker tag receipts-manager:latest "$IMAGE:$VERSION"
          docker tag receipts-manager:latest "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
