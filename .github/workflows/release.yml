name: Build and Release macOS App
# Explicit permissions for security
permissions:
  contents: write
  actions: read
  deployments: write
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
jobs:
  build-macos:
    name: Build macOS Application
    runs-on: macos-latest
    environment: production
    permissions:
      contents: write
      actions: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install Homebrew dependencies
        run: |
          brew install tesseract tesseract-lang
      - name: Create Python virtual environment
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          deactivate
      - name: Install Node dependencies
        working-directory: platforms/macos
        run: npm ci
      - name: Build macOS app
        working-directory: platforms/macos
        run: |
          # Detect architecture
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            npm run build
          else
            npm run build:x64
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: List build artifacts
        run: |
          echo "Build artifacts:"
          ls -lh platforms/macos/dist/
      - name: Upload DMG artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: Receipt-Manager-macOS
          path: platforms/macos/dist/*.dmg
          if-no-files-found: error
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          files: platforms/macos/dist/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      actions: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build Docker image
        working-directory: platforms/docker
        run: |
          docker build -f Dockerfile -t receipts-manager:latest ../..
      - name: Test Docker image
        run: |
          docker run -d -p 8765:8765 --name test-container receipts-manager:latest
          sleep 10
          curl -f http://localhost:8765 || exit 1
          docker stop test-container
      - name: Export Docker image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker save receipts-manager:latest | gzip > receipt-manager-docker.tar.gz
      - name: Upload Docker image artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: Receipt-Manager-Docker
          path: receipt-manager-docker.tar.gz
      - name: Add Docker image to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          files: receipt-manager-docker.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
